plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = "${project.mod_version}-forge-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    reobf = false

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                retrochat {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('jar', Jar) {
    destinationDirectory = layout.buildDirectory.dir("libs/mods")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}.jar"
}

tasks.named('sourcesJar', Jar) {
    destinationDirectory = layout.buildDirectory.dir("libs/sources")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}-sources.jar"
}
