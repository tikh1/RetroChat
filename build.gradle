plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = "${project.mod_version}-forge-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        output.resourcesDir = layout.buildDirectory.dir("classes/java/main")
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('jar', Jar) {
    destinationDirectory = layout.buildDirectory.dir("libs/mods")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}.jar"
}

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir("libs/sources")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}-sources.jar"
}
