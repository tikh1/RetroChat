plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = "${project.mod_version}-forge-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = project.forge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', 'retrochat'
        }
    }

    mods {
        retrochat {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

tasks.named('jar', Jar) {
    destinationDirectory = layout.buildDirectory.dir("libs/mods")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}.jar"
}

tasks.named('sourcesJar', Jar) {
    destinationDirectory = layout.buildDirectory.dir("libs/sources")
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-forge-${project.minecraft_version}-sources.jar"
}
